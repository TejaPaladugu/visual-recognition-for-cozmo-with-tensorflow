<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"></head><body>
<title>Pulm Rounds</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a 3D exam room fills the left; a paper patient chart docks on the right (stacks below on phones).
   Deliberately single-theme: a dim ward with monitor glow, plus a light paper chart. */
:root{
  color-scheme: dark;
  --room:#121b23; --room-2:#1a2630; --room-3:#223240; --line:#2d3e4c; --room-ink:#e3ebf0; --room-ink-2:#93a6b4;
  --paper:#eef0eb; --paper-2:#e2e6df; --ink:#1b2833; --ink-2:#5a6873; --rule:#cdd3ca;
  --accent:#23857c; --accent-2:#1a6a63; --accent-ink:#ffffff; --accent-soft:#d5e9e5;
  --hr:#5be08a; --spo2:#45c8f0; --bp:#ff7a72; --rr:#f5d04a; --temp:#e3ebf0;
  --key:#1f7a72; --useful:#2f7d46; --opt:#66727c; --low:#a86812; --harm:#b8392a;
  --f-display:"Barlow Condensed","Arial Narrow",sans-serif;
  --f-body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--room);color:var(--room-ink);font-family:var(--f-body);font-size:15px;line-height:1.45;overflow:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--spo2);outline-offset:2px}
#app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr)}

/* top bar */
.topbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 22px;padding:8px 16px;background:#0c141a;border-bottom:1px solid var(--line)}
.brand{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:.16em;background:none;border:0;padding:0;cursor:pointer;color:#cfe8e4}
.brand span{color:var(--hr)}
.ptinfo{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.ptinfo b{font-family:var(--f-display);font-size:19px;font-weight:600;letter-spacing:.02em}
.ptinfo small{color:var(--room-ink-2);font-size:12px;letter-spacing:.04em;text-transform:uppercase}
.vitals{display:flex;gap:16px;font-family:var(--f-mono);flex-wrap:wrap}
.v{display:flex;flex-direction:column;line-height:1.05;font-variant-numeric:tabular-nums}
.v small{font-size:10px;letter-spacing:.1em;opacity:.75}
.v b{font-size:19px;font-weight:600}
.v.hr{color:var(--hr)} .v.bp{color:var(--bp)} .v.rr{color:var(--rr)} .v.sp{color:var(--spo2)} .v.t{color:var(--temp)}
.v .o2{font-size:10px;opacity:.8}
.meters{margin-left:auto;display:flex;gap:18px;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.meters div{display:flex;flex-direction:column;line-height:1.05}
.meters small{font-size:10px;letter-spacing:.1em;color:var(--room-ink-2)}
.meters b{font-size:19px}
.flash{animation:flash .9s ease-out}
@keyframes flash{0%{color:#fff;text-shadow:0 0 10px #fff}100%{}}

/* stage */
.stage{display:grid;grid-template-columns:minmax(0,1fr) minmax(340px,430px);min-height:0}
.view{position:relative;min-width:0;min-height:0;overflow:hidden;background:var(--room)}
#gl{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#gl.dragging{cursor:grabbing}
#gl.pointing{cursor:pointer}
.tip{position:absolute;pointer-events:none;background:#0c141aee;border:1px solid var(--line);color:var(--room-ink);font-size:13px;padding:4px 8px;border-radius:4px;white-space:nowrap;transform:translate(12px,12px)}
.tip em{color:var(--room-ink-2);font-style:normal;font-family:var(--f-mono);font-size:11px;margin-left:6px}
.camBtns{position:absolute;top:12px;left:12px;display:flex;gap:6px;flex-wrap:wrap;max-width:calc(100% - 24px)}
.camBtns button{background:#0c141acc;border:1px solid var(--line);border-radius:4px;padding:4px 10px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;color:var(--room-ink-2)}
.camBtns button:hover{color:var(--room-ink);border-color:var(--room-ink-2)}
.hint{position:absolute;right:12px;top:14px;font-size:12px;color:var(--room-ink-2);text-align:right}
.banner{position:absolute;left:50%;top:52px;transform:translateX(-50%);background:#3a1512f0;border:1px solid var(--bp);color:#ffe2df;padding:8px 14px;border-radius:4px;font-weight:600;max-width:calc(100% - 32px);text-align:center;box-shadow:0 6px 24px #0008}
.toast{position:absolute;left:12px;bottom:12px;width:min(470px,calc(100% - 24px));max-height:52%;overflow:auto;background:var(--paper);color:var(--ink);border-radius:6px;box-shadow:0 10px 30px #000a;padding:12px 14px 14px;color-scheme:light}
.toast h4{margin:0 0 6px;font-family:var(--f-display);font-size:17px;letter-spacing:.04em;text-transform:uppercase;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.toast h4 small{font-family:var(--f-mono);font-size:11px;color:var(--ink-2);text-transform:none;letter-spacing:0}
.toast .x{position:sticky;float:right;top:0;border:0;background:var(--paper-2);border-radius:4px;width:26px;height:26px;cursor:pointer;color:var(--ink)}
.res{border-top:1px solid var(--rule);padding:7px 0}
.res:first-of-type{border-top:0}
.res .n{font-weight:700;font-size:13px}
.res .r{font-family:var(--f-mono);font-size:12.5px;white-space:pre-wrap}
.thumb{display:block;margin-top:6px;border:0;padding:0;background:#000;border-radius:3px;cursor:zoom-in;line-height:0}
.thumb canvas{width:120px;height:144px;border-radius:3px}

/* panel (paper chart) */
.panel{background:var(--paper);color:var(--ink);display:flex;flex-direction:column;min-height:0;color-scheme:light;border-left:1px solid #0006}
.brief{padding:14px 18px 12px;border-bottom:2px solid var(--ink)}
.brief .meta{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.brief q{display:block;font-family:var(--f-display);font-size:22px;font-weight:600;line-height:1.15;margin:4px 0 6px;quotes:"“" "”";text-wrap:balance}
.brief p{margin:0;font-size:14px;color:var(--ink)}
.tabs{display:flex;border-bottom:1px solid var(--rule);background:var(--paper-2)}
.tabs button{flex:1;border:0;background:none;padding:10px 4px 8px;font-family:var(--f-display);font-size:16px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);cursor:pointer;border-bottom:3px solid transparent}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);background:var(--paper)}
.tabs .badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--accent);color:#fff;font-family:var(--f-mono);font-size:11px;line-height:18px;letter-spacing:0}
.tabbody{flex:1;overflow:auto;padding:4px 0 12px;min-height:0}
.sect{padding:6px 18px 2px;font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.help{padding:8px 18px;font-size:13px;color:var(--ink-2)}
.row{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--rule);padding:9px 18px;cursor:pointer;color:var(--ink)}
.row:hover{background:#fff8}
.row .q{flex:1;min-width:0}
.row .cost{font-family:var(--f-mono);font-size:11px;color:var(--ink-2);white-space:nowrap;padding-top:2px}
.row.done{cursor:default;background:#fff6}
.row.done .q b{font-weight:600}
.ans{display:block;margin-top:3px;font-size:14px;color:#2a3a46;border-left:2px solid var(--accent);padding-left:8px}
.ord{display:flex;gap:10px;align-items:center;padding:7px 18px;border-bottom:1px solid var(--rule);cursor:pointer}
.ord input{width:17px;height:17px;accent-color:var(--accent);flex:none}
.ord .q{flex:1;min-width:0;font-size:14px}
.ord .cost{font-family:var(--f-mono);font-size:11px;color:var(--ink-2);white-space:nowrap;text-align:right}
.ord.got{cursor:default;color:var(--ink-2)}
.ord.got .q::after{content:" · resulted";font-size:12px;color:var(--accent)}
.cartbar{position:sticky;bottom:-12px;background:var(--paper);border-top:2px solid var(--ink);padding:10px 18px;display:flex;gap:12px;align-items:center;justify-content:space-between}
.cartbar span{font-family:var(--f-mono);font-size:12px;color:var(--ink-2)}
.entry{padding:10px 18px;border-bottom:1px solid var(--rule)}
.entry .h{display:flex;gap:8px;align-items:baseline;font-size:13px}
.entry .tm{font-family:var(--f-mono);font-size:11px;color:var(--ink-2)}
.entry .tag{font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;padding:1px 5px;border-radius:3px;background:var(--paper-2);color:var(--ink-2)}
.entry .tag.ev{background:#f7d9d4;color:var(--harm)}
.entry .b{font-size:14px;margin-top:2px}
.entry .b.mono{font-family:var(--f-mono);font-size:12.5px;white-space:pre-wrap}
.commit{padding:12px 18px;border-top:2px solid var(--ink);background:var(--paper-2);display:flex;gap:10px;align-items:center}
.commit small{color:var(--ink-2);font-size:12px;flex:1}
.btn{border:0;border-radius:5px;padding:10px 16px;font-family:var(--f-display);font-size:17px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.btn:hover{background:var(--accent-2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.btn.ghost:hover{background:#0000000d}
.btn.dark{background:transparent;color:var(--room-ink);box-shadow:inset 0 0 0 1.5px var(--room-ink-2)}

/* overlays */
.overlay{position:fixed;inset:0;z-index:20;overflow:auto;background:#0b1217e8;padding:max(24px,env(safe-area-inset-top,0px)) 16px 32px}
.sheet{max-width:880px;margin:0 auto;background:var(--paper);color:var(--ink);border-radius:8px;box-shadow:0 20px 60px #000c;color-scheme:light}
.sheet header{padding:18px 22px 12px;border-bottom:2px solid var(--ink)}
.sheet header .meta{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.sheet h2{font-family:var(--f-display);font-size:30px;line-height:1.05;margin:4px 0 0;font-weight:700;letter-spacing:.01em;text-wrap:balance}
.sheet .body{padding:14px 22px 20px}
.sheet footer{padding:14px 22px;border-top:1px solid var(--rule);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.search{width:100%;box-sizing:border-box;padding:10px 12px;font:inherit;border:1.5px solid var(--ink-2);border-radius:5px;background:#fff;color:var(--ink);margin-bottom:10px}
.dxlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:6px}
.dxlist label,.planlist label{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--rule);border-radius:5px;cursor:pointer;background:#fff8}
.dxlist label:has(input:checked),.planlist label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.dxlist input,.planlist input{accent-color:var(--accent);margin-top:3px;flex:none}
.planlist{display:grid;gap:6px}
.chosen{font-size:14px;color:var(--ink-2);margin:0 0 10px}
.chosen b{color:var(--ink)}

/* menu */
#menu{background:radial-gradient(1200px 600px at 70% -10%,#1d3a40cc,transparent 60%),#0b1217f0}
.menuwrap{max-width:1080px;margin:0 auto}
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px;align-items:end;padding:18px 0 22px;border-bottom:1px solid var(--line)}
.hero h1{font-family:var(--f-display);font-weight:700;font-size:clamp(46px,9vw,92px);line-height:.88;letter-spacing:.04em;margin:0;color:#e8f3f1}
.hero h1 span{color:var(--hr)}
.hero p{margin:10px 0 0;color:var(--room-ink-2);max-width:56ch;font-size:16px}
.ekg{width:100%;height:46px;display:block;margin-top:8px}
.scoring{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.scoring div{background:var(--room-2);padding:10px 12px}
.scoring b{display:block;font-family:var(--f-mono);font-size:24px;color:#fff}
.scoring small{font-size:12px;color:var(--room-ink-2);display:block;line-height:1.3}
.menubar{display:flex;gap:10px;justify-content:space-between;align-items:center;padding:16px 0 10px;flex-wrap:wrap}
.menubar h3{margin:0;font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--room-ink-2);font-weight:400}
.cases{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.card{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--paper);color:var(--ink);border:0;border-radius:6px;padding:12px 14px 12px;cursor:pointer;transition:transform .15s ease,box-shadow .15s ease;color-scheme:light}
.card:hover{transform:translateY(-2px);box-shadow:0 10px 24px #0009}
.card .top{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.card .nm{font-family:var(--f-display);font-size:21px;font-weight:600;line-height:1.05}
.card q{font-size:14px;color:#33434f;quotes:"“" "”";flex:1}
.card .best{font-family:var(--f-mono);font-size:12px;color:var(--ink-2);border-top:1px dashed var(--rule);padding-top:6px;display:flex;justify-content:space-between}
.grade{font-family:var(--f-display);font-weight:700}
.g-A{color:#1d7a47}.g-B{color:#2a6f8f}.g-C{color:#8a6a10}.g-D{color:#a4551c}.g-F{color:#b8392a}

/* debrief */
.scorehead{display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px;align-items:center}
.biggrade{font-family:var(--f-display);font-size:96px;font-weight:700;line-height:.8;width:90px;text-align:center}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:110px minmax(0,1fr) 62px;gap:10px;align-items:center;font-size:14px}
.bar .track{height:10px;background:var(--paper-2);border-radius:5px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--rule)}
.bar .fill{height:100%;background:var(--accent);border-radius:5px}
.bar b{font-family:var(--f-mono);font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
.total{font-family:var(--f-mono);font-size:13px;color:var(--ink-2)}
.dsec{margin-top:18px}
.dsec h3{font-family:var(--f-display);font-size:19px;letter-spacing:.06em;text-transform:uppercase;margin:0 0 6px;border-bottom:1px solid var(--rule);padding-bottom:4px}
.ded{margin:0;padding:0;list-style:none;font-size:14px}
.ded li{padding:3px 0;font-family:var(--f-mono);font-size:12.5px}
.rv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;padding:7px 0;border-bottom:1px solid var(--rule);font-size:14px}
.rv .why{grid-column:2;color:var(--ink-2);font-size:13.5px}
.chip{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:3px;color:#fff;white-space:nowrap;align-self:start;margin-top:2px}
.chip.key,.chip.essential{background:var(--key)} .chip.useful,.chip.good{background:var(--useful)} .chip.optional,.chip.ok{background:var(--opt)} .chip.low,.chip.wrong{background:var(--low)} .chip.harmful{background:var(--harm)}
.chip.missed{background:transparent;color:var(--harm);box-shadow:inset 0 0 0 1px var(--harm)}
.pick{font-family:var(--f-mono);font-size:11px;color:var(--ink-2)}
.pick.on{color:var(--ink);font-weight:600}
.pearls{margin:0;padding-left:20px;font-size:14.5px}
.pearls li{margin:5px 0}
.verdict{font-size:15px;margin:10px 0 0}
.verdict b{font-family:var(--f-display);font-size:18px;letter-spacing:.02em}

#imgModal .sheet{max-width:560px}
#imgModal canvas{width:100%;max-width:420px;height:auto;display:block;margin:0 auto;border-radius:4px;background:#000}
.read{font-family:var(--f-mono);font-size:13px;white-space:pre-wrap;margin-top:12px}

@media (max-width:860px){
  body{overflow:auto}
  #app{height:auto;display:block}
  .stage{display:block}
  .view{height:50vh;min-height:300px}
  .panel{border-left:0}
  .tabbody{overflow:visible}
  .meters{margin-left:0}
  .hint{display:none}
  .hero{grid-template-columns:1fr}
  .scorehead{grid-template-columns:1fr}
  .biggrade{text-align:left}
  .cartbar{bottom:0}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app">
  <header class="topbar">
    <button class="brand" id="brandBtn" title="All cases">PULM<span>·</span>ROUNDS</button>
    <div class="ptinfo" id="ptInfo"><b>No patient</b><small>Choose a case</small></div>
    <div class="vitals" id="vitals"></div>
    <div class="meters">
      <div><small>CLOCK</small><b id="clock">0:00</b></div>
      <div><small>SPENT</small><b id="cost">$0</b></div>
    </div>
  </header>
  <main class="stage">
    <div class="view" id="view">
      <canvas id="gl" aria-label="3D exam room. Click the patient to examine a body region."></canvas>
      <div class="camBtns" id="camBtns">
        <button data-cam="overview">Overview</button>
        <button data-cam="head">Head &amp; neck</button>
        <button data-cam="chest">Chest</button>
        <button data-cam="hands">Hands</button>
        <button data-cam="legs">Legs</button>
      </div>
      <div class="hint">Drag to orbit · scroll to zoom<br>Click the patient to examine</div>
      <div class="tip" id="tip" hidden></div>
      <div class="banner" id="banner" hidden></div>
      <div class="toast" id="toast" hidden></div>
    </div>
    <aside class="panel" id="panel">
      <div class="brief" id="brief"></div>
      <nav class="tabs" role="tablist" id="tabs">
        <button role="tab" data-tab="history">History</button>
        <button role="tab" data-tab="exam">Exam</button>
        <button role="tab" data-tab="orders">Orders</button>
        <button role="tab" data-tab="chart">Chart</button>
      </nav>
      <div class="tabbody" id="tabbody"></div>
      <div class="commit">
        <small>Ready? Your diagnosis and plan are final once submitted.</small>
        <button class="btn" id="commitBtn">Diagnose</button>
      </div>
    </aside>
  </main>
</div>

<div class="overlay" id="menu"></div>
<div class="overlay" id="dxModal" hidden></div>
<div class="overlay" id="planModal" hidden></div>
<div class="overlay" id="debrief" hidden></div>
<div class="overlay" id="imgModal" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
"use strict";
/* =========================================================
   DATA
   ========================================================= */
const TESTS = [
  {id:'cbc', name:'CBC with differential', cat:'Labs', cost:30, min:30, normal:'WBC 7.4 · Hgb 13.9 · Plt 240'},
  {id:'cmp', name:'Comprehensive metabolic panel', cat:'Labs', cost:45, min:30, normal:'Na 139 · K 4.1 · Cl 103 · HCO3 25 · BUN 14 · Cr 0.9 · Glu 98 · Ca 9.3 · AST 22 · ALT 19'},
  {id:'abg', name:'Arterial blood gas', cat:'Labs', cost:80, min:15, normal:'pH 7.41 · PaCO2 39 · PaO2 94 · HCO3 24'},
  {id:'lactate', name:'Lactate', cat:'Labs', cost:30, min:20, normal:'Lactate 1.0 mmol/L'},
  {id:'trop', name:'High-sensitivity troponin', cat:'Labs', cost:50, min:45, normal:'hs-Troponin T 5 ng/L (normal)'},
  {id:'bnp', name:'BNP', cat:'Labs', cost:60, min:45, normal:'BNP 38 pg/mL'},
  {id:'ddimer', name:'D-dimer', cat:'Labs', cost:50, min:40, normal:'D-dimer 0.28 µg/mL FEU (negative)'},
  {id:'pct', name:'Procalcitonin', cat:'Labs', cost:90, min:60, normal:'Procalcitonin 0.04 ng/mL'},
  {id:'osm', name:'Serum & urine osmolality, urine Na', cat:'Labs', cost:90, min:45, normal:'Serum osm 288 · Urine osm 410 · Urine Na 35'},
  {id:'endo', name:'TSH and AM cortisol', cat:'Labs', cost:110, min:60, normal:'TSH 1.9 mIU/L · AM cortisol 15 µg/dL'},
  {id:'ace', name:'Serum ACE level', cat:'Labs', cost:70, min:60, normal:'ACE 32 U/L (normal)'},
  {id:'auto', name:'Autoimmune panel (ANA, RF, CCP, Scl-70, Jo-1)', cat:'Labs', cost:220, min:60, normal:'All negative'},
  {id:'a1at', name:'Alpha-1 antitrypsin level', cat:'Labs', cost:120, min:60, normal:'AAT 142 mg/dL (normal)'},

/* =========================================================
   STATE
   ========================================================= */
let C = null;   // current case
let S = null;   // current play state
let toastTimer = null, bannerTimer = null;
const $ = s => document.querySelector(s);
const fmtClock = m => `${Math.floor(m/60)}:${String(m%60).padStart(2,'0')}`;
const money = n => '$' + n.toLocaleString('en-US');
const clamp = (x,a,b) => Math.max(a, Math.min(b, x));
const lerp = (a,b,t) => a + (b-a)*t;

function loadBest(){ try { return JSON.parse(localStorage.getItem('pulmRounds.best') || '{}'); } catch(e){ return {}; } }
function saveBest(id, score){ try { const b = loadBest(); if(!b[id] || score > b[id]) { b[id] = score; localStorage.setItem('pulmRounds.best', JSON.stringify(b)); } } catch(e){} }
function gradeOf(s){ return s>=90?'A': s>=80?'B': s>=70?'C': s>=60?'D':'F'; }

function curVitals(){
  if(!C) return null;
  const v = Object.assign({}, C.vitals);
  if(S && S.arrested) return {hr:38, sbp:null, dbp:null, rr:0, spo2:null, temp:v.temp, o2:v.o2, pea:true};
  if(S && C.decline){
    const f = clamp(S.clock / C.decline.by, 0, 1);
    for(const k in C.decline.to) v[k] = Math.round(lerp(C.vitals[k], C.decline.to[k], f));
  }
  return v;
}

function resultFor(id){
  const t = TEST[id], o = C.tests[id];
  if(o) return {r:o.r, y:o.y, w:o.w, img: id==='cxr' ? (o.img || {}) : null};
  return {
    r: t.normal,
    y: t.invasive ? 'harmful' : 'low',
    w: t.invasive ? 'An invasive procedure with no indication here.' : 'Normal or unhelpful in this case. It didn’t move the diagnosis or the plan.',
    img: id==='cxr' ? {} : null,
  };
}

/* =========================================================
   GAME ACTIONS
   ========================================================= */
function startCase(id, restore){
  C = CASES.find(c=>c.id===id);
  S = restore || {caseId:id, clock:0, cost:0, asked:[], examined:[], ordered:{}, cart:[], log:[], fired:[], arrested:false, tab:'history', unseen:0, dx:null, plan:[]};
  setPatient(C.look);
  ['menu','dxModal','planModal','debrief','imgModal'].forEach(i=>$('#'+i).hidden = true);
  hideToast(); $('#banner').hidden = true;
  renderAll();
  setCam('overview', true);
  if(!restore) showToast(`<h4>${C.bed} · ${C.setting}<small>T+0:00</small></h4><div class="res"><div class="r" style="font-family:var(--f-body);font-size:14px">Take a history, examine (click the patient), and send orders. Every action moves the clock, and the patient won’t wait forever.</div></div>`, 7000);
  if(S.arrested) showBanner('PEA arrest. Commit to your plan now.', true);
}

function advance(min){
  S.clock += min;
  for(const ev of (C.events||[])){
    if(S.clock >= ev.at && !S.fired.includes(ev.at)){
      S.fired.push(ev.at);
      addLog({type:'event', title:'Status change', body:ev.text});
      showBanner(ev.text);
    }
  }
  if(C.arrestAt && S.clock >= C.arrestAt && !S.arrested){
    S.arrested = true;
    addLog({type:'event', title:'Code blue', body:'PEA arrest. CPR in progress.'});
    showBanner('PEA arrest. Commit to your plan now.', true);
  }
  renderTop(true);
}

function addLog(e){ e.at = S.clock; S.log.push(e); if(S.tab !== 'chart' && (e.type==='rx' || e.type==='event')) S.unseen++; }

function askHistory(q){
  if(S.asked.includes(q)) return;
  S.asked.push(q);
  advance(1);
  const ans = C.hist[q] || C.histDefault || HIST_DEFAULT[q];
  addLog({type:'hx', title:HISTORY_Q.find(h=>h[0]===q)[1], body:ans});
  renderTabs(); renderTab();
}

function doExam(e){
  const finding = C.exam[e] || EXAM_DEFAULT[e];
  if(!S.examined.includes(e)){
    S.examined.push(e);
    advance(2);
    addLog({type:'ex', title:EXAM_NAME[e], body:finding});
    renderTabs(); renderTab();
  }
  showToast(`<h4>${EXAM_NAME[e]}<small>T+${fmtClock(S.clock)}</small></h4><div class="res"><div class="r" style="font-family:var(--f-body);font-size:14.5px">${finding}</div></div>`, 8000);
}

function sendOrders(){
  const ids = S.cart.filter(id=>!S.ordered[id]);
  if(!ids.length) return;
  const dt = Math.max(...ids.map(id=>TEST[id].min));
  const cost = ids.reduce((a,id)=>a+TEST[id].cost, 0);
  S.cost += cost; S.cart = [];
  advance(dt);
  const items = [];
  ids.forEach(id=>{
    const R = resultFor(id);
    S.ordered[id] = {at:S.clock};
    addLog({type:'rx', id, title:TEST[id].name, body:R.r, img:R.img});
    items.push({id, R, idx:S.log.length-1});
  });
  renderTabs(); renderTab();
  const html = `<h4>${ids.length} result${ids.length>1?'s':''} back<small>+${dt} min · ${money(cost)}</small></h4>` +
    items.map(({id,R,idx})=>`<div class="res"><div class="n">${TEST[id].name}</div><div class="r">${R.r}</div>${R.img?`<button class="thumb" data-img="${idx}" aria-label="Open chest X-ray"><canvas data-cxr='${JSON.stringify(R.img)}'></canvas></button>`:''}</div>`).join('');
  showToast(html, 0);
  paintThumbs($('#toast'));
}

/* =========================================================
   RENDERING (DOM)
   ========================================================= */
function renderAll(){ renderTop(); renderBrief(); renderTabs(); renderTab(); }

function renderTop(flash){
  if(!C){ $('#ptInfo').innerHTML = '<b>No patient</b><small>Choose a case</small>'; $('#vitals').innerHTML=''; return; }
  $('#ptInfo').innerHTML = `<b>${C.name}</b><small>${C.age} ${C.sex} · ${C.setting}</small>`;
  const v = curVitals();
  const d = x => x==null ? '--' : x;
  $('#vitals').innerHTML =
    `<div class="v hr"><small>HR</small><b>${d(v.hr)}</b></div>`+
    `<div class="v bp"><small>BP</small><b>${v.sbp==null?'--/--':v.sbp+'/'+v.dbp}</b></div>`+
    `<div class="v rr"><small>RR</small><b>${d(v.rr)}</b></div>`+
    `<div class="v sp"><small>SpO₂ <span class="o2">${v.o2}</span></small><b>${v.spo2==null?'--':v.spo2+'%'}</b></div>`+
    `<div class="v t"><small>TEMP</small><b>${v.temp.toFixed(1)}°</b></div>`;
  const ck = $('#clock'), co = $('#cost');
  ck.textContent = fmtClock(S.clock); co.textContent = money(S.cost);
  if(flash){ [ck,co].forEach(el=>{ el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }); }
}

function renderBrief(){
  $('#brief').innerHTML = `<div class="meta">${C.bed} · ${C.setting} · ${C.name}, ${C.age} ${C.sex}</div><q>${C.cc}</q><p>${C.brief}</p>`;
}

function renderTabs(){
  document.querySelectorAll('#tabs button').forEach(b=>{
    const t = b.dataset.tab;
    b.setAttribute('aria-selected', String(S.tab===t));
    const label = {history:'History', exam:'Exam', orders:'Orders', chart:'Chart'}[t];
    b.innerHTML = label + (t==='chart' && S.unseen ? `<span class="badge">${S.unseen}</span>` : '');
  });
}

function renderTab(){
  const el = $('#tabbody');
  if(S.tab==='history'){
    el.innerHTML = `<div class="help">Each question takes 1 minute.</div>` + HISTORY_Q.map(([id,q])=>{
      const done = S.asked.includes(id);
      const ans = C.hist[id] || C.histDefault || HIST_DEFAULT[id];
      return `<button class="row ${done?'done':''}" data-ask="${id}" ${done?'aria-disabled="true"':''}><span class="q">${done?`<b>${q}</b><span class="ans">${ans}</span>`:q}</span>${done?'':'<span class="cost">+1 min</span>'}</button>`;
    }).join('');
  } else if(S.tab==='exam'){
    el.innerHTML = `<div class="help">Click the patient in the 3D view, or pick a system below. Each takes 2 minutes.</div>` + EXAM_ITEMS.map(([id,name,verb])=>{
      const done = S.examined.includes(id);
      const f = C.exam[id] || EXAM_DEFAULT[id];
      return `<button class="row ${done?'done':''}" data-exam="${id}"><span class="q">${done?`<b>${name}</b><span class="ans">${f}</span>`:`${name} <span style="color:var(--ink-2);font-size:13px">· ${verb}</span>`}</span>${done?'':'<span class="cost">+2 min</span>'}</button>`;
    }).join('');
  } else if(S.tab==='orders'){
    const cart = S.cart.filter(id=>!S.ordered[id]);
    const dt = cart.length ? Math.max(...cart.map(id=>TEST[id].min)) : 0;
    const cost = cart.reduce((a,id)=>a+TEST[id].cost,0);
    el.innerHTML = `<div class="help">Pick tests, then send them together. The clock advances by the slowest test in the batch. Not every result will help.</div>` +
      TEST_CATS.map(cat=>`<div class="sect">${cat}</div>` + TESTS.filter(t=>t.cat===cat).map(t=>{
        const got = !!S.ordered[t.id];
        return `<label class="ord ${got?'got':''}" for="o-${t.id}"><input type="checkbox" id="o-${t.id}" data-order="${t.id}" ${got?'checked disabled':''} ${S.cart.includes(t.id)?'checked':''}><span class="q">${t.name}</span><span class="cost">${money(t.cost)}<br>${t.min>=60?(t.min/60).toFixed(t.min%60?1:0)+' h':t.min+' min'}</span></label>`;
      }).join('')).join('') +
      `<div class="cartbar"><span>${cart.length? `${cart.length} selected · +${dt} min · ${money(cost)}` : 'Nothing selected'}</span><button class="btn" id="sendBtn" ${cart.length?'':'disabled'}>Send orders</button></div>`;
  } else {
    S.unseen = 0; renderTabs();
    if(!S.log.length){ el.innerHTML = `<div class="help">Nothing charted yet. Questions, exam findings, and results show up here, newest first.</div>`; return; }
    const tagName = {hx:'HX', ex:'EXAM', rx:'RESULT', event:'EVENT'};

}

/* ---------- scoring ---------- */
function score(){
  const notes = {dx:[], mg:[], ef:[]};
  // diagnosis
  let dx = 0;
  if(S.dx===C.dx){ dx = 40; notes.dx.push('Correct diagnosis +40'); }
  else if(C.dxPartial && C.dxPartial[S.dx]){ dx = C.dxPartial[S.dx]; notes.dx.push(`Close: ${DXN[S.dx]} +${dx}`); }
  else notes.dx.push(`${DXN[S.dx]} is incorrect. +0`);
  // management
  const W = {essential:2, good:1};
  const tot = C.plan.reduce((a,p)=>a+(W[p.k]||0),0);
  let got = 0, wrong = 0, harm = 0;
  S.plan.forEach(i=>{ const k = C.plan[i].k; if(W[k]) got += W[k]; if(k==='wrong') wrong++; if(k==='harmful') harm++; });
  const base = Math.round(40*got/tot);
  notes.mg.push(`Indicated orders chosen: ${got}/${tot} weight → ${base}`);
  if(wrong) notes.mg.push(`${wrong} not-indicated order${wrong>1?'s':''}: −${4*wrong}`);
  if(harm) notes.mg.push(`${harm} harmful order${harm>1?'s':''}: −${10*harm}`);
  const missedEss = C.plan.filter((p,i)=>p.k==='essential' && !S.plan.includes(i)).length;
  if(missedEss) notes.mg.push(`${missedEss} essential order${missedEss>1?'s':''} missed`);
  const mg = clamp(base - 4*wrong - 10*harm, 0, 40);
  // efficiency
  let ef = 20;
  Object.keys(S.ordered).forEach(id=>{
    const y = resultFor(id).y;
    if(y==='low'){ ef -= 2; notes.ef.push(`Low yield: ${TEST[id].name} −2`); }
    if(y==='harmful'){ ef -= 6; notes.ef.push(`Harmful: ${TEST[id].name} −6`); }
  });
  const overT = S.clock / C.target.min - 1;
  if(overT > 0){ const p = Math.min(6, Math.ceil(overT*10)); ef -= p; notes.ef.push(`Time ${fmtClock(S.clock)} vs ${fmtClock(C.target.min)} target −${p}`); }
  else notes.ef.push(`Time ${fmtClock(S.clock)}, within ${fmtClock(C.target.min)} target`);
  const overC = S.cost / C.target.cost - 1;
  if(overC > 0){ const p = Math.min(4, Math.ceil(overC*5)); ef -= p; notes.ef.push(`Spent ${money(S.cost)} vs ${money(C.target.cost)} target −${p}`); }
  else notes.ef.push(`Spent ${money(S.cost)}, within ${money(C.target.cost)} target`);
  const keys = [...Object.entries(C.tests).filter(([,t])=>t.y==='key').map(([id])=>'t:'+id), ...(C.keyExam||[]).map(e=>'e:'+e)];
  const hasKey = keys.some(k=> k.startsWith('t:') ? S.ordered[k.slice(2)] : S.examined.includes(k.slice(2)));
  if(keys.length && !hasKey){ ef -= 5; notes.ef.push('No key finding obtained before committing −5'); }
  ef = clamp(ef, 0, 20);
  let total = dx + mg + ef;
  if(S.arrested){ total = Math.max(0, total - 15); notes.ef.push('Patient arrested before treatment: −15 overall'); }
  return {dx, mg, ef, total, notes};
}

        ${skipped.length ? skipped.map(s=>`<div class="rv"><span class="chip missed">Missed</span><span><b>${s}</b></span><span class="why">A key part of this workup.</span></div>`).join('') : ''}
      </div>
      <div class="dsec"><h3>Management review</h3>${C.plan.map((p,i)=>{ const on = S.plan.includes(i); return `<div class="rv"><span class="chip ${p.k}">${KIND_LABEL[p.k]}</span><span><b>${p.t}</b> <span class="pick ${on?'on':''}">${on?'· you chose this':'· not chosen'}</span></span><span class="why">${p.w}</span></div>`; }).join('')}</div>
      <div class="dsec"><h3>High-yield pearls</h3><ul class="pearls">${C.pearls.map(p=>`<li>${p}</li>`).join('')}</ul></div>
    </div>
    <footer><button class="btn ghost" id="dbMenu">All patients</button><button class="btn ghost" id="dbRetry">Retry this case</button><button class="btn" id="dbNext">Next patient</button></footer></div>`;
  ['dxModal','planModal'].forEach(i=>$('#'+i).hidden = true);
  m.hidden = false; m.scrollTop = 0;
}

/* =========================================================
   CHEST X-RAY (schematic canvas)
   ========================================================= */
function rng(seed){ return function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed>>>15, 1|seed); t = t + Math.imul(t ^ t>>>7, 61|t) ^ t; return ((t ^ t>>>14)>>>0)/4294967296; }; }
function drawCXR(cv, p){
  p = p || {};
  const W=300, H=360; cv.width = W*2; cv.height = H*2;
  const g = cv.getContext('2d'); g.setTransform(2,0,0,2,0,0);
  const R = rng(7);
  g.fillStyle='#000'; g.fillRect(0,0,W,H);
  // soft tissue
  let gr = g.createRadialGradient(150,210,30,150,210,200); gr.addColorStop(0,'#6a6a6a'); gr.addColorStop(1,'#262626');
  g.fillStyle = gr; g.beginPath(); g.moveTo(8,H); g.bezierCurveTo(4,150,18,70,62,46); g.quadraticCurveTo(110,30,128,14); g.lineTo(172,14); g.quadraticCurveTo(190,30,238,46); g.bezierCurveTo(282,70,296,150,292,H); g.closePath(); g.fill();
  const ten = p.ptx && p.ptx.tension;
  const shift = ten ? (p.ptx.side==='R' ? 24 : -24) : 0;
  const bot = p.hyper ? (p.mild ? 284 : 300) : p.lowVol ? 244 : 270;
  const lung = (s) => { // s=-1 patient right (viewer left), +1 patient left
    const m = x => 150 + s*x;
    const sideIsPtx = p.ptx && ((p.ptx.side==='R' && s<0) || (p.ptx.side==='L' && s>0));
    // tension: the mediastinum moves away from the collapsed side
    const md = ten ? (sideIsPtx ? -Math.abs(shift)*.8 : Math.abs(shift)) : 0;
    const b = bot + (sideIsPtx && ten ? 14 : 0);
    const dome = p.hyper ? 6 : 28;
    const P = new Path2D();
    P.moveTo(m(28+md), 72);
    P.bezierCurveTo(m(38+md*.5),46, m(82),46, m(98),70);
    P.bezierCurveTo(m(120),100, m(127),190, m(116), b);
    P.bezierCurveTo(m(96), b-dome*1.1, m(56), b-dome, m(24+md), b-dome*.7);
    P.lineTo(m(22+md), 120);
    P.closePath();
    return {P, m, b, sideIsPtx};
  };
  const L = {R: lung(-1), L: lung(1)};
  // lungs
  for(const k of ['R','L']){
    const {P, m} = L[k];
    const lg = g.createLinearGradient(0,60,0,bot); lg.addColorStop(0,'#141414'); lg.addColorStop(1, p.hyper?'#0a0a0a':'#1b1b1b');
    g.fillStyle = lg; g.fill(P);
    // vascular markings
    g.save(); g.clip(P);
    g.strokeStyle = p.hyper ? 'rgba(255,255,255,.08)' : 'rgba(255,255,255,.14)';
    for(let i=0;i<14;i++){
      const a = -1.3 + R()*2.4; const len = 40 + R()*70;
      g.lineWidth = 2.2 - R();
      g.beginPath(); g.moveTo(m(40), 150+ (R()-.5)*20);
      g.quadraticCurveTo(m(40+Math.cos(a)*len*.5), 150+Math.sin(a)*len*.5 + (R()-.5)*16, m(40+Math.cos(a)*len), 150+Math.sin(a)*len);
      g.stroke();
    }
    g.restore();
  }
  // ribs
  for(const s of [-1,1]){
    for(let i=0;i<9;i++){
      const y = 62 + i*24 + (p.hyper? i*2 : 0);
      g.strokeStyle = 'rgba(255,255,255,.13)'; g.lineWidth = 7;
      g.beginPath(); g.moveTo(150+s*12, y); g.quadraticCurveTo(150+s*80, y-30, 150+s*128, y+20); g.stroke();
      g.strokeStyle = 'rgba(0,0,0,.18)'; g.lineWidth = 2.5; g.stroke();
    }
  }
  // clavicles
  g.strokeStyle='rgba(235,235,235,.55)'; g.lineWidth=8; g.lineCap='round';
  for(const s of [-1,1]){ g.beginPath(); g.moveTo(150+s*22,58); g.quadraticCurveTo(150+s*70,46,150+s*118,40); g.stroke(); }
  // mediastinum + spine
  const cx = 150 + shift;
  let mg = g.createLinearGradient(cx-30,0,cx+30,0); mg.addColorStop(0,'rgba(190,190,190,0)'); mg.addColorStop(.3,'rgba(200,200,200,.55)'); mg.addColorStop(.7,'rgba(200,200,200,.55)'); mg.addColorStop(1,'rgba(190,190,190,0)');
  g.fillStyle = mg; g.fillRect(cx-30, 60, 60, H-60);
  // trachea air column
  g.strokeStyle='rgba(0,0,0,.55)'; g.lineWidth=11; g.lineCap='butt';
  g.beginPath(); g.moveTo(150,20); g.quadraticCurveTo(150, 80, cx, 130); g.stroke();
  // aortic knob
  g.fillStyle='rgba(215,215,215,.75)'; g.beginPath(); g.arc(cx+20,108,14,0,Math.PI*2); g.fill();
  // heart
  const hrx = p.hyper ? 38 : 50;
  const hg = g.createRadialGradient(cx+12, bot-62, 10, cx+12, bot-62, 70); hg.addColorStop(0,'rgba(215,215,215,.95)'); hg.addColorStop(1,'rgba(170,170,170,.85)');
  g.fillStyle = hg; g.beginPath(); g.ellipse(cx+14, bot-58, hrx, p.hyper?44:50, -0.2, 0, Math.PI*2); g.fill();
  // stomach bubble (patient left = viewer right)
  if(!(p.effusion && p.effusion.side==='L')){ g.fillStyle='rgba(0,0,0,.5)'; g.beginPath(); g.ellipse(200, bot+22, 22, 12, 0, 0, Math.PI*2); g.fill(); }
  // hila
  for(const s of [-1,1]){ g.fillStyle='rgba(210,210,210,.35)'; g.beginPath(); g.ellipse(150+shift+s*40,150,10,16,0,0,Math.PI*2); g.fill(); }

  const zoneY = z => z==='upper' ? 98 : z==='mid' ? 160 : bot-48;
  const side = s => s==='R' ? L.R : L.L;
  // consolidation
  (p.consol||[]).forEach(c=>{
    const {P, m} = side(c.side); const y = zoneY(c.zone); const r = 62*(c.size||1);
    g.save(); g.clip(P);
    const cg = g.createRadialGradient(m(72), y, 5, m(72), y, r); cg.addColorStop(0,'rgba(240,240,240,.85)'); cg.addColorStop(.6,'rgba(220,220,220,.55)'); cg.addColorStop(1,'rgba(200,200,200,0)');
    g.fillStyle = cg; g.fillRect(0,0,W,H);
    g.strokeStyle='rgba(0,0,0,.45)'; g.lineWidth=1.6;
    for(let i=0;i<4;i++){ g.beginPath(); g.moveTo(m(48), y-10+i*6); g.lineTo(m(70+R()*20), y-14+i*10); g.lineTo(m(86+R()*12), y-20+i*14); g.stroke(); }
    g.restore();
  });
  // diffuse (ARDS)
  if(p.diffuse){
    for(const k of ['R','L']){
      const {P, m} = L[k];
      g.save(); g.clip(P);
      for(let i=0;i<46;i++){
        const x = m(26 + R()*92), y = 80 + R()*(bot-90), r = 14 + R()*22;
        const dg = g.createRadialGradient(x,y,2,x,y,r); dg.addColorStop(0,'rgba(230,230,230,.42)'); dg.addColorStop(1,'rgba(230,230,230,0)');
        g.fillStyle = dg; g.beginPath(); g.arc(x,y,r,0,Math.PI*2); g.fill();
      }
      g.restore();
    }
  }
  // reticular
  if(p.retic){
    for(const k of ['R','L']){
      const {P, m} = L[k];
      const y0 = p.retic==='lower' ? bot-90 : 120, y1 = p.retic==='lower' ? bot : 200;
      g.save(); g.clip(P);
      g.strokeStyle='rgba(255,255,255,.32)'; g.lineWidth=1;
      for(let i=0;i<120;i++){ const x = m(24+R()*96), y = y0 + R()*(y1-y0); g.beginPath(); g.moveTo(x,y); g.lineTo(x+(R()-.5)*12, y+(R()-.5)*12); g.stroke(); }
      if(p.retic==='lower'){ for(let i=0;i<22;i++){ const x = m(92+R()*24), y = y0+20+R()*(y1-y0-30); g.beginPath(); g.arc(x,y,3+R()*2.5,0,Math.PI*2); g.stroke(); } }
      g.restore();
    }
  }
  // hilar adenopathy
  if(p.hilar){
    for(const s of [-1,1]){ for(let i=0;i<3;i++){ g.fillStyle='rgba(225,225,225,.6)'; g.beginPath(); g.arc(150+s*(40+i*4), 136+i*16, 13-i*1.5, 0, Math.PI*2); g.fill(); } }
    g.fillStyle='rgba(225,225,225,.45)'; g.beginPath(); g.arc(138,108,10,0,Math.PI*2); g.fill();
  }
  // mass
  if(p.mass){
    const s = p.mass.side==='R' ? -1 : 1;
    const mx = 150+s*52, my = 148;
    const mg2 = g.createRadialGradient(mx,my,4,mx,my,36); mg2.addColorStop(0,'rgba(240,240,240,.95)'); mg2.addColorStop(.75,'rgba(225,225,225,.8)'); mg2.addColorStop(1,'rgba(220,220,220,0)');
    g.fillStyle = mg2; g.beginPath();
    for(let a=0;a<Math.PI*2;a+=0.3){ const r = 30 + Math.sin(a*3)*5; const x = mx+Math.cos(a)*r, y = my+Math.sin(a)*r; a===0?g.moveTo(x,y):g.lineTo(x,y); }
    g.closePath(); g.fill();
    g.fillStyle='rgba(220,220,220,.5)'; g.fillRect(150+s*14-(s<0?14:0), 70, 16, 60);
  }
  // cavity
  if(p.cavity){
    const {m} = side(p.cavity.side); const x = m(70), y = 96;
    g.fillStyle='#050505'; g.beginPath(); g.arc(x,y,15,0,Math.PI*2); g.fill();
    g.strokeStyle='rgba(240,240,240,.85)'; g.lineWidth=6; g.beginPath(); g.arc(x,y,18,0,Math.PI*2); g.stroke();
  }
  // effusion
  if(p.effusion){
    const {P, m, b} = side(p.effusion.side);
    const level = b - 30 - p.effusion.size*150;
    g.save(); g.clip(P);
    const eg = g.createLinearGradient(0, level-10, 0, level+30); eg.addColorStop(0,'rgba(225,225,225,0)'); eg.addColorStop(1,'rgba(225,225,225,.92)');
    g.fillStyle = eg;
    g.beginPath(); g.moveTo(m(10), level+18); g.quadraticCurveTo(m(80), level+12, m(130), level-26); g.lineTo(m(130), H); g.lineTo(m(10), H); g.closePath(); g.fill();
    g.restore();
  }
  // pneumothorax
  if(p.ptx){
    const {P, m, b} = side(p.ptx.side);
    g.save(); g.clip(P);
    g.fillStyle='#030303'; g.fillRect(0,0,W,H);
    // collapsed lung near hilum
    const CL = new Path2D(); CL.ellipse(m(46 + (ten?-4:0)), 160, ten?20:44, ten?42:80, 0, 0, Math.PI*2);
    g.fillStyle='rgba(120,120,120,.75)'; g.fill(CL);
    g.strokeStyle='rgba(255,255,255,.7)'; g.lineWidth=1.3; g.stroke(CL);
    g.restore();
  }
  // markers
  g.fillStyle='#fff'; g.font='bold 18px ui-monospace, monospace'; g.fillText('R', 16, 30);
  g.font='11px ui-monospace, monospace'; g.fillStyle='rgba(255,255,255,.7)'; g.fillText(p.view||'PA', W-34, 26);
}

/* ---------- patient ---------- */
function mixHex(a, b, t){ const A = new THREE.Color(a), B = new THREE.Color(b); return A.lerp(B, t); }
const gownTex = () => canvasTex(128,128,(g,w,h)=>{ g.fillStyle='#bcd2de'; g.fillRect(0,0,w,h); g.fillStyle='#8eb0c3'; for(let y=0;y<h;y+=16) for(let x=(y/16%2)*8;x<w;x+=16){ g.beginPath(); g.moveTo(x,y+4); g.lineTo(x+4,y); g.lineTo(x+8,y+4); g.lineTo(x+4,y+8); g.closePath(); g.fill(); } }, [3,2]);

function setPatient(L){
  if(!glOK) return;
  if(patientGroup){ scene.remove(patientGroup); patientGroup.traverse(o=>{ if(o.geometry) o.geometry.dispose(); }); }
  pat = buildPatient(L); patientGroup = pat.grp; scene.add(patientGroup);
  hovered = null;
}

function buildPatient(L){
  const grp = new THREE.Group();
  const regionMeshes = {};
  const skinColor = new THREE.Color(L.skin);
  const skinM = () => new THREE.MeshStandardMaterial({color:skinColor, roughness: L.sweat ? .32 : .72, metalness: L.sweat ? .06 : 0});
  const gT = gownTex();
  const gownM = () => new THREE.MeshStandardMaterial({map:gT, roughness:.9});
  const mk = (geo, mat, parent, pos, region) => {
    const m = new THREE.Mesh(geo, mat); m.position.set(...pos); m.castShadow = true; m.receiveShadow = true; parent.add(m);
    if(region){ m.userData.region = region; (regionMeshes[region] = regionMeshes[region] || []).push(m); }
    return m;
  };
  const limb = (parent, a, b, r1, r2, mat, region) => {
    const A = new THREE.Vector3(...a), B = new THREE.Vector3(...b), d = new THREE.Vector3().subVectors(B,A), len = d.length();
    const m = mk(new THREE.CylinderGeometry(r2, r1, len, 14), mat, parent, [0,0,0], region);
    m.position.copy(A).addScaledVector(d,.5); m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), d.normalize());
    return m;
  };
  const H = L.habitus;
  const wide = H==='obese'?1.22 : H==='heavy'?1.1 : H==='thin'?.9 : 1;
  const depth = L.barrel ? .95 : H==='obese' ? .9 : H==='heavy' ? .8 : .68;
  const torso = new THREE.Group(); torso.position.set(0,.736,.125); torso.rotation.x = -0.96; grp.add(torso);

  // abdomen + pelvis
  const abd = mk(new THREE.CylinderGeometry(.18*wide, .175*wide*(H==='obese'?1.18:1), .3, 24), gownM(), torso, [0,.17,0], 'abd');
  abd.scale.z = depth * (H==='obese'?1.25 : H==='heavy'?1.1 : 1);
  const pel = mk(new THREE.SphereGeometry(.19*wide, 20, 14), gownM(), torso, [0,.02,0]); pel.scale.set(1,.6,depth);
  // chest halves: theta π..2π is the patient's right (−x)
  const chestR = mk(new THREE.CylinderGeometry(.205*wide, .185*wide, .32, 20, 1, false, Math.PI, Math.PI), gownM(), torso, [0,.46,0], 'lungR');
  const chestL = mk(new THREE.CylinderGeometry(.205*wide, .185*wide, .32, 20, 1, false, 0, Math.PI), gownM(), torso, [0,.46,0], 'lungL');
  chestR.scale.z = chestL.scale.z = depth;
  const capTop = mk(new THREE.SphereGeometry(.205*wide, 20, 10, 0, Math.PI*2, 0, Math.PI/2), gownM(), torso, [0,.6,0]); capTop.scale.set(1,.35,depth);
  for(const s of [-1,1]) mk(new THREE.SphereGeometry(.075*wide, 14, 10), gownM(), torso, [s*.2*wide,.575,0]);
  // heart hotspot (invisible until hovered)
  const hz = .195*wide*depth + .006;
  const heartHot = mk(new THREE.SphereGeometry(.07, 18, 12), new THREE.MeshBasicMaterial({color:0x6cf0e0, transparent:true, opacity:0, depthWrite:false}), torso, [.06,.42,hz], 'heart');
  heartHot.scale.z = .25; heartHot.castShadow = false;
  // neck
  const neckR = .052 * (H==='obese'?1.4 : H==='heavy'?1.15 : 1);
  mk(new THREE.CylinderGeometry(neckR, neckR*1.1, .13, 16), skinM(), torso, [0,.67,0], 'neck');
  const trachea = mk(new THREE.CylinderGeometry(.015,.015,.1,10), new THREE.MeshStandardMaterial({color:skinColor.clone().multiplyScalar(.92), roughness:.7}), torso, [(L.trachea||0)*.026,.67,neckR*.86], 'neck');
  let jvd = null;
  if(L.jvd){ jvd = mk(new THREE.CylinderGeometry(.009,.009,.11,8), std('#4c5f94',.5), torso, [-.036,.672,neckR*.8], 'neck'); jvd.rotation.z = .25; }
  // head
  const headG = new THREE.Group(); headG.position.set(0,.82,0); torso.add(headG);
  const head = mk(new THREE.SphereGeometry(.11, 28, 20), skinM(), headG, [0,0,0], 'heent'); head.scale.set(.92,1.06,1);
  for(const s of [-1,1]){
    mk(new THREE.SphereGeometry(.012, 10, 8), std('#1d1d1d',.3), headG, [s*.037,.018,.096], 'heent');
    mk(new THREE.BoxGeometry(.03,.006,.01), std(L.hair,.9), headG, [s*.037,.04,.098], 'heent');
    const ear = mk(new THREE.SphereGeometry(.025, 10, 8), skinM(), headG, [s*.1,.0,0], 'heent'); ear.scale.set(.45,1,.7);
  }
  const nose = mk(new THREE.ConeGeometry(.017,.045,10), skinM(), headG, [0,-.008,.11], 'heent'); nose.rotation.x = Math.PI/2;
  const lipC = mixHex('#a8645c', '#5a5c98', clamp(L.cyan||0,0,1));
  const lips = mk(new THREE.BoxGeometry(.048,.012,.014), new THREE.MeshStandardMaterial({color:lipC, roughness:.5}), headG, [0,-.052,.094], 'heent');
  const hairM = std(L.hair,.9);
  const cap = mk(new THREE.SphereGeometry(.117, 24, 16, 0, Math.PI*2, 0, Math.PI*.5), hairM, headG, [0,.008,-.008], 'heent'); cap.rotation.x = -0.5; cap.scale.set(.95,1.05,1);
  if(L.sex==='F'){ const long = mk(new THREE.SphereGeometry(.12, 20, 14), hairM, headG, [0,-.07,-.05], 'heent'); long.scale.set(1.05,1.25,.55); }
  // oxygen delivery
  if(L.o2==='cannula'){
    const tubeM = new THREE.MeshStandardMaterial({color:'#dff4f5', transparent:true, opacity:.85, roughness:.3});
    const t = mk(new THREE.TorusGeometry(.112,.004,6,40), tubeM, headG, [0,-.022,0]); t.rotation.x = Math.PI/2 - .12;
    for(const s of [-1,1]) limb(headG, [s*.1,-.03,.03], [s*.13,-.2,.06], .004,.004, tubeM);
  } else if(L.o2==='mask'){
    const mm = new THREE.MeshStandardMaterial({color:'#bfe8d0', transparent:true, opacity:.5, roughness:.2});
    const mask = mk(new THREE.SphereGeometry(.062, 18, 12, 0, Math.PI*2, 0, Math.PI/2), mm, headG, [0,-.035,.085], 'heent'); mask.rotation.x = Math.PI/2; mask.scale.set(1,.7,1.2);
    const bag = mk(new THREE.SphereGeometry(.05, 12, 10), mm, headG, [0,-.13,.13]); bag.scale.set(1,1.3,.8);
  }
  // arms + hands
  const tipC = mixHex(L.skin, '#7880b6', clamp((L.cyan||0)*.9,0,1));
  for(const s of [-1,1]){
    const sh = [s*.215*wide,.56,0], el = [s*.255*wide,.31,.03], wr = [s*.265*wide,.08,.07];
    limb(torso, sh, [s*.23*wide,.47,.01], .06*wide, .058*wide, gownM());
    limb(torso, sh, el, .048*wide, .042*wide, skinM());
    limb(torso, el, wr, .041*wide, .033, skinM());
    const hand = mk(new THREE.SphereGeometry(.04, 14, 10), skinM(), torso, [wr[0], wr[1]-.045, wr[2]+.005], 'hands'); hand.scale.set(1,1.35,.55);
    for(let f=0; f<4; f++){
      const fx = wr[0] + (f-1.5)*.017, base = [fx, wr[1]-.085, wr[2]+.01], tip = [fx, wr[1]-.13 + Math.abs(f-1.5)*.008, wr[2]+.012];
      limb(torso, base, tip, .0085, .008, skinM(), 'hands');
      mk(new THREE.SphereGeometry(L.clubbing ? .016 : .0095, 10, 8), new THREE.MeshStandardMaterial({color:tipC, roughness:.5}), torso, tip, 'hands');
    }
  }
  // legs (world-aligned, lying on the bed)
  for(const s of [-1,1]){
    const sw = L.swollen && ((L.swollen==='L' && s>0) || (L.swollen==='R' && s<0));
    const legM = sw ? new THREE.MeshStandardMaterial({color:mixHex(L.skin,'#c0574a',.3), roughness:.6}) : skinM();
    const hx = s*.1*wide;
    limb(grp, [hx,.705,.15], [hx,.7,.58], .08*wide, .068*wide, skinM());
    mk(new THREE.SphereGeometry(.06*wide, 12, 10), skinM(), grp, [hx,.7,.58], 'legs');
    limb(grp, [hx,.7,.58], [s*.095,.688,.97], (sw?.075:.06)*wide, (sw?.06:.045), legM, 'legs');
    mk(new THREE.BoxGeometry(.075,.15,.065), skinM(), grp, [s*.095,.75,1.0], 'legs');
  }
  const blanket = mk(new THREE.BoxGeometry(.68*wide,.07,.6), new THREE.MeshStandardMaterial({map: canvasTex(64,64,(g,w,h)=>{ g.fillStyle='#5f86a3'; g.fillRect(0,0,w,h); g.fillStyle='#6f95b1'; g.fillRect(0,0,w,8); }, [1,4]), roughness:.95}), grp, [0,.8,.36]);
  blanket.rotation.x = .02;

  return {grp, torso, chestR, chestL, abd, jvd, head:headG, regionMeshes, look:L, depth};
}

/* ---------- camera ---------- */
function camPreset(name){
  const w = new THREE.Vector3();
  if(!pat) return {az:-0.75, el:.42, dist:2.9, target:new THREE.Vector3(0,.92,-.05)};
  if(name==='head'){ pat.head.getWorldPosition(w); return {az:-0.25, el:.55, dist:.95, target:w.clone().add(new THREE.Vector3(0,-.06,0))}; }
  if(name==='chest'){ pat.chestR.getWorldPosition(w); return {az:-0.35, el:.85, dist:1.25, target:w.clone()}; }
  if(name==='hands'){ return {az:-1.2, el:.7, dist:1.0, target:new THREE.Vector3(0,.72,.15)}; }
  if(name==='legs'){ return {az:-0.75, el:.6, dist:1.3, target:new THREE.Vector3(0,.72,.75)}; }
  return {az:-0.75, el:.42, dist:2.9, target:new THREE.Vector3(0,.92,-.05)};
}
function setCam(name, instant){
  if(!glOK) return;
  const p = camPreset(name);
  if(instant){ cam.az=p.az; cam.el=p.el; cam.dist=p.dist; cam.target.copy(p.target); cam.goal=null; }
  else cam.goal = p;
}
function applyCam(){
  if(cam.goal){
    const k = .12;
    cam.az = lerp(cam.az, cam.goal.az, k); cam.el = lerp(cam.el, cam.goal.el, k); cam.dist = lerp(cam.dist, cam.goal.dist, k); cam.target.lerp(cam.goal.target, k);
    if(Math.abs(cam.az-cam.goal.az)<.002 && Math.abs(cam.dist-cam.goal.dist)<.002) cam.goal = null;
  }
  const t = cam.target;
  camera.position.set(t.x + cam.dist*Math.cos(cam.el)*Math.sin(cam.az), t.y + cam.dist*Math.sin(cam.el), t.z + cam.dist*Math.cos(cam.el)*Math.cos(cam.az));
  camera.lookAt(t);
}

function resize(){
  const v = $('#view'); const w = v.clientWidth, h = v.clientHeight;
  if(!w || !h) return;
  renderer.setSize(w, h, false); camera.aspect = w/h; camera.updateProjectionMatrix();
}

/* ---------- pointer ---------- */
function pick(ev){
  if(!patientGroup) return null;
  const r = $('#gl').getBoundingClientRect();
  const v = new THREE.Vector2(((ev.clientX-r.left)/r.width)*2-1, -((ev.clientY-r.top)/r.height)*2+1);
  raycaster.setFromCamera(v, camera);
  const hit = raycaster.intersectObject(patientGroup, true)[0];
  return hit && hit.object.userData.region ? hit.object.userData.region : null;
}
function setHover(region){
  if(hovered === region) return;
  const paint = (rg, on) => (pat.regionMeshes[rg]||[]).forEach(m=>{
    if(m.material.isMeshBasicMaterial) m.material.opacity = on ? .4 : 0;
    else m.material.emissive.setHex(on ? 0x1d5f59 : 0x000000);
  });
  if(hovered) paint(hovered, false);
  hovered = region;
  if(region) paint(region, true);
}
function bindPointer(cv){
  const pts = new Map(); let down = null, moved = 0, pinch0 = 0;
  cv.addEventListener('pointerdown', e=>{ cv.setPointerCapture(e.pointerId); pts.set(e.pointerId, {x:e.clientX, y:e.clientY}); down = {x:e.clientX, y:e.clientY}; moved = 0; if(pts.size===2){ const [a,b] = [...pts.values()]; pinch0 = Math.hypot(a.x-b.x, a.y-b.y); } });
  cv.addEventListener('pointermove', e=>{
    const tip = $('#tip');
    if(pts.has(e.pointerId)){
      const p = pts.get(e.pointerId); const dx = e.clientX-p.x, dy = e.clientY-p.y; p.x = e.clientX; p.y = e.clientY;
      moved += Math.abs(dx)+Math.abs(dy);
      if(pts.size===2){ const [a,b] = [...pts.values()]; const d = Math.hypot(a.x-b.x, a.y-b.y); if(pinch0){ cam.dist = clamp(cam.dist * pinch0/d, .6, 5); } pinch0 = d; cam.goal = null; }
      else if(moved > 4){ cam.goal = null; cam.az -= dx*.006; cam.el = clamp(cam.el + dy*.005, .05, 1.45); cv.classList.add('dragging'); tip.hidden = true; }
      return;
    }
    const rg = pick(e); setHover(rg);
    cv.classList.toggle('pointing', !!rg);
    if(rg && C && !S.done){ const r = $('#view').getBoundingClientRect(); tip.innerHTML = `${REGION_TIP[rg]}<em>${S.examined.includes(rg)?'done':'+2 min'}</em>`; tip.style.left = (e.clientX-r.left)+'px'; tip.style.top = (e.clientY-r.top)+'px'; tip.hidden = false; }
    else tip.hidden = true;
  });
  const up = e=>{
    const was = pts.has(e.pointerId); pts.delete(e.pointerId); if(pts.size<2) pinch0 = 0;
    cv.classList.remove('dragging');
    if(was && moved < 6 && C && !S.done && pts.size===0){ const rg = pick(e); if(rg) doExam(rg); }
  };
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', e=>{ pts.delete(e.pointerId); cv.classList.remove('dragging'); });
  cv.addEventListener('pointerleave', ()=>{ if(!pts.size){ setHover(null); $('#tip').hidden = true; } });
  cv.addEventListener('wheel', e=>{ e.preventDefault(); cam.goal = null; cam.dist = clamp(cam.dist * (1 + e.deltaY*.0012), .6, 5); }, {passive:false});
}

/* ---------- monitor ---------- */
const gauss = (p, mu, s) => Math.exp(-(((p-mu)/s)**2));
function ecgAt(t, v){ if(!v.hr) return 0; const beat = 60/v.hr; const p = ((t%beat)+beat)%beat/beat;
  if(v.pea) return .35*gauss(p,.3,.06) - .1*gauss(p,.45,.08);
  return .12*gauss(p,.12,.025) - .12*gauss(p,.215,.006) + 1*gauss(p,.235,.009) - .28*gauss(p,.255,.008) + .22*gauss(p,.45,.045); }
function plethAt(t, v){ if(v.spo2==null || !v.hr) return 0; const beat = 60/v.hr; const p = (((t-.12)%beat)+beat)%beat/beat; return .9*gauss(p,.18,.08) + .35*gauss(p,.42,.07); }
function respAt(t, v){ if(!v.rr) return 0; return Math.sin(2*Math.PI*t*v.rr/60)*.8; }
function drawMonitor(t){
  const g = monCtx, W = 512, H = 320;
  g.fillStyle = '#03070a'; g.fillRect(0,0,W,H);
  g.strokeStyle = '#0d1a20'; g.lineWidth = 1; for(let x=0;x<340;x+=20){ g.beginPath(); g.moveTo(x,0); g.lineTo(x,H); g.stroke(); }
  if(!C){ g.fillStyle='#45c8f0'; g.font='600 22px monospace'; g.fillText('STANDBY', 190, 165); monTex.needsUpdate = true; return; }
  const v = curVitals();
  const rows = [{y:80, c:'#5be08a', f:ecgAt, a:48, lab:'II'}, {y:175, c:'#45c8f0', f:plethAt, a:42, lab:'Pleth'}, {y:265, c:'#f5d04a', f:respAt, a:26, lab:'Resp'}];
  for(const r of rows){
    g.fillStyle = r.c; g.font = '14px monospace'; g.fillText(r.lab, 8, r.y-48);
    g.strokeStyle = r.c; g.lineWidth = 2.5; g.beginPath();
    for(let x=0; x<=330; x+=3){ const tt = t - (330-x)/120; const y = r.y - r.f(tt, v)*r.a; x?g.lineTo(x,y):g.moveTo(x,y); }
    g.stroke();
  }
  const num = (label, val, c, y, size) => { g.fillStyle = c; g.font = '14px monospace'; g.fillText(label, 350, y-size+4); g.font = `600 ${size}px monospace`; g.fillText(val, 350, y+6); };
  num('HR', v.hr ?? '--', '#5be08a', 70, 46);
  num('SpO2 %', v.spo2 ?? '--', '#45c8f0', 150, 40);
  num('NIBP', v.sbp==null ? '--/--' : `${v.sbp}/${v.dbp}`, '#ff7a72', 220, 30);
  num('RR', v.rr ?? '--', '#f5d04a', 285, 30);
  g.fillStyle='#e3ebf0'; g.font='600 22px monospace'; g.fillText(`${v.temp.toFixed(1)}°`, 440, 290);
  if(v.pea && Math.floor(t*2)%2){ g.fillStyle='#ff4a3d'; g.font='700 20px monospace'; g.fillText('NO PULSE', 120, 30); }
  monTex.needsUpdate = true;
}

/* ---------- loop ---------- */
function loop(ms){
  const t = ms/1000;
  if(pat && C){
    const v = curVitals();
    const rr = v.rr || 0;
    const ph = rr ? Math.sin(2*Math.PI*t*rr/60) : 0;
    const amp = rr > 28 ? .07 : .045;
    const asym = pat.look.asym;
    pat.chestR.scale.z = pat.depth * (1 + ph*amp*(asym==='R' ? .15 : 1));
    pat.chestL.scale.z = pat.depth * (1 + ph*amp*(asym==='L' ? .15 : 1));
    pat.chestR.scale.x = 1 + ph*amp*.3*(asym==='R'?.15:1); pat.chestL.scale.x = 1 + ph*amp*.3*(asym==='L'?.15:1);
    pat.head.rotation.x = ph*.02;
    if(pat.jvd) pat.jvd.scale.x = pat.jvd.scale.z = 1 + .35*Math.max(0, Math.sin(2*Math.PI*t*(v.hr||60)/60));
  }
  if(ms - lastMon > 45){ drawMonitor(t); lastMon = ms; }
  applyCam();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

/* =========================================================
   EVENTS / WIRING
   ========================================================= */
document.addEventListener('click', e=>{
  const el = e.target.closest('button, input');
  if(!el) return;
  if(el.dataset.case){ startCase(el.dataset.case); return; }
  if(el.id==='randomBtn'){ const pool = CASES.filter(c=>!C || c.id!==C.id); startCase(pool[Math.floor(Math.random()*pool.length)].id); return; }
  if(el.id==='resumeBtn'){ $('#menu').hidden = true; return; }
  if(el.id==='brandBtn'){ renderMenu(); return; }
  if(el.dataset.cam){ setCam(el.dataset.cam); return; }
  if(el.dataset.close){ $('#'+el.dataset.close).hidden = true; return; }
  if(el.classList.contains('x')){ hideToast(); return; }
  if(el.dataset.img){ openImage(+el.dataset.img); return; }
  if(!S || S.done) return;
  if(el.dataset.tab){ S.tab = el.dataset.tab; renderTabs(); renderTab(); $('#tabbody').scrollTop = 0; return; }
  if(el.dataset.ask){ askHistory(el.dataset.ask); return; }
  if(el.dataset.exam){ doExam(el.dataset.exam); return; }
  if(el.dataset.order){ const id = el.dataset.order; if(el.checked){ if(!S.cart.includes(id)) S.cart.push(id); } else S.cart = S.cart.filter(x=>x!==id); const st = $('#tabbody').scrollTop; renderTab(); $('#tabbody').scrollTop = st; return; }
  if(el.id==='sendBtn'){ sendOrders(); return; }
  if(el.id==='commitBtn'){ openDx(); return; }
  if(el.id==='dxNext'){ const r = document.querySelector('input[name="dx"]:checked'); if(!r){ $('#dxSearch').focus(); $('#dxSearch').placeholder = 'Pick a diagnosis first'; return; } S.dx = r.value; $('#dxModal').hidden = true; openPlan(); return; }
  if(el.id==='planBack'){ S.plan = [...document.querySelectorAll('#planModal input:checked')].map(i=>+i.value); $('#planModal').hidden = true; openDx(); return; }
  if(el.id==='planSubmit'){ S.plan = [...document.querySelectorAll('#planModal input:checked')].map(i=>+i.value); finish(); return; }
});
document.addEventListener('click', e=>{
  const el = e.target.closest('button'); if(!el) return;
  if(el.id==='dbRetry'){ startCase(C.id); }
  else if(el.id==='dbMenu'){ $('#debrief').hidden = true; renderMenu(); }
  else if(el.id==='dbNext'){ const i = CASES.findIndex(c=>c.id===C.id); startCase(CASES[(i+1)%CASES.length].id); }
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape'){ if(!$('#imgModal').hidden) $('#imgModal').hidden = true; else if(!$('#dxModal').hidden) $('#dxModal').hidden = true; } });

function boot(data){
  initScene();
  const snap = data && data.st;
  if(snap && CASES.some(c=>c.id===snap.caseId)){ startCase(snap.caseId, snap); if(data.menu) renderMenu(); }
  else { renderTop(); renderMenu(); }
}
if(window.claude && window.claude.hot && window.claude.hot.snapshot){ try { window.claude.hot.snapshot(()=>({st: S && !S.done ? S : null, menu: !$('#menu').hidden})); } catch(e){} }
if(window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(boot);
else boot((window.claude && window.claude.hot && window.claude.hot.data) || {});
</script>
